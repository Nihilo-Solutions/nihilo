<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(11,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .sw{background:var(--bg);padding:16px 10px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
  .chip{width:100%;height:70px;border-radius:2px;border:1px solid var(--line)}
  .n{font-family:var(--font-mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-dim)}
  .hex{font-family:var(--font-mono);font-size:9px;color:var(--fg-mute)}
</style>
</head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="n">0</div><div class="hex">#FFFFFF</div></div>
  <div class="sw"><div class="chip" style="background:#F4F5F7"></div><div class="n">50</div><div class="hex">#F4F5F7</div></div>
  <div class="sw"><div class="chip" style="background:#E4E6EB"></div><div class="n">100</div><div class="hex">#E4E6EB</div></div>
  <div class="sw"><div class="chip" style="background:#C7CBD4"></div><div class="n">200</div><div class="hex">#C7CBD4</div></div>
  <div class="sw"><div class="chip" style="background:#9AA0AE"></div><div class="n">300</div><div class="hex">#9AA0AE</div></div>
  <div class="sw"><div class="chip" style="background:#6B7280"></div><div class="n">400</div><div class="hex">#6B7280</div></div>
  <div class="sw"><div class="chip" style="background:#4B5360"></div><div class="n">500</div><div class="hex">#4B5360</div></div>
  <div class="sw"><div class="chip" style="background:#303643"></div><div class="n">600</div><div class="hex">#303643</div></div>
  <div class="sw"><div class="chip" style="background:#1E222D"></div><div class="n">700</div><div class="hex">#1E222D</div></div>
  <div class="sw"><div class="chip" style="background:#14171F"></div><div class="n">800</div><div class="hex">#14171F</div></div>
  <div class="sw"><div class="chip" style="background:#0B0D14"></div><div class="n">900</div><div class="hex">#0B0D14</div></div>
</div>
</body>
</html>
