<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .wrap{padding:26px 32px;display:flex;flex-direction:column;gap:14px;min-height:150px}
  .row{display:flex;align-items:baseline;gap:24px;border-bottom:1px solid var(--line);padding-bottom:10px}
  .row:last-child{border-bottom:0}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-faint);min-width:120px}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="tag">H3 · 24/600</span><span class="t-h3">Enterprise RAG Implementation</span></div>
  <div class="row"><span class="tag">H4 · 18/600</span><span class="t-h4">Tenant-local vector stores</span></div>
  <div class="row"><span class="tag">Body · 16/400</span><span class="t-body" style="max-width:440px">We build AI automations deployed inside your cloud, not ours. Azure-native. Production in 4–6 weeks.</span></div>
  <div class="row"><span class="tag">Small · 14/400</span><span class="t-sm">Median retrieval latency &lt;200ms on typical document stores.</span></div>
</div>
</body>
</html>
