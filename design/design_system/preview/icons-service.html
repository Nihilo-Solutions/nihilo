<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;min-height:150px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px 10px;border:1px solid var(--line);border-radius:2px}
  .well{width:56px;height:56px;background:#14171F;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--accent-lit)}
  .lab{font-family:var(--font-mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-dim);text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="cell"><div class="well"><img src="../assets/icons/emergence.svg" width="24" height="24"/></div><span class="lab">Emergence</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/rag.svg" width="24" height="24"/></div><span class="lab">RAG</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/agentic.svg" width="24" height="24"/></div><span class="lab">Agentic</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/security.svg" width="24" height="24"/></div><span class="lab">Security</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/azure.svg" width="24" height="24"/></div><span class="lab">Azure</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/aws.svg" width="24" height="24"/></div><span class="lab">AWS</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/pipeline.svg" width="24" height="24"/></div><span class="lab">Pipeline</span></div>
  <div class="cell"><div class="well"><img src="../assets/icons/audit.svg" width="24" height="24"/></div><span class="lab">Audit</span></div>
</div>
</body>
</html>
