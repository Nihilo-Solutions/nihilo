<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;min-height:150px}
  .card{padding:22px;background:rgba(255,255,255,0.02);border:1px solid var(--line);border-radius:12px;transition:border-color var(--dur-base)}
  .card:hover{border-color:var(--line-azure)}
  .well{width:44px;height:44px;border-radius:8px;background:#1E222D;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--accent-lit)}
  .card h4{font-family:var(--font-sans);font-size:15px;font-weight:600;color:#fff;margin:0 0 6px;letter-spacing:-.01em}
  .card p{font-size:12.5px;color:var(--fg-dim);line-height:1.55;margin:0}
  .eb{font-family:var(--font-mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--fg-faint);margin-bottom:10px;display:block}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <span class="eb">01 · RAG</span>
    <div class="well"><img src="../assets/icons/rag.svg" width="22" height="22"/></div>
    <h4>Tenant-local RAG</h4>
    <p>Embeddings and vector stores stay inside your VPC. Hybrid retrieval with reranking.</p>
  </div>
  <div class="card">
    <span class="eb">02 · Agents</span>
    <div class="well"><img src="../assets/icons/agentic.svg" width="22" height="22"/></div>
    <h4>Agentic Automation</h4>
    <p>Policy-sandboxed agents for routine ops with full audit trails.</p>
  </div>
  <div class="card">
    <span class="eb">03 · Cloud</span>
    <div class="well"><img src="../assets/icons/azure.svg" width="22" height="22"/></div>
    <h4>Azure-Native AI</h4>
    <p>IaC, autoscaling inference, telemetry-driven governance.</p>
  </div>
</div>
</body>
</html>
