<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .wrap{padding:28px;display:grid;grid-template-columns:repeat(4,1fr);gap:20px;min-height:150px}
  .col{display:flex;flex-direction:column;align-items:center;gap:14px}
  .box{width:80px;height:80px;background:#14171F;border:1px solid var(--line);border-radius:8px}
  .lab{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-dim)}
  .note{font-family:var(--font-mono);font-size:9px;color:var(--fg-faint)}
</style>
</head>
<body>
<div class="wrap">
  <div class="col"><div class="box" style="box-shadow:0 1px 2px rgba(0,0,0,.35)"></div><div class="lab">Shadow 1</div><div class="note">Fine elevation</div></div>
  <div class="col"><div class="box" style="box-shadow:0 4px 12px rgba(0,0,0,.45)"></div><div class="lab">Shadow 2</div><div class="note">Cards · menus</div></div>
  <div class="col"><div class="box" style="box-shadow:0 12px 40px rgba(0,0,0,.55)"></div><div class="lab">Shadow 3</div><div class="note">Floating · modals</div></div>
  <div class="col"><div class="box" style="box-shadow:0 0 24px rgba(45,107,255,.45);border-color:var(--accent)"></div><div class="lab">Glow Azure</div><div class="note">CTA · active</div></div>
</div>
</body>
</html>
