<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .wrap{padding:28px 32px;display:flex;flex-direction:column;gap:18px;min-height:150px}
  .row{display:flex;align-items:baseline;gap:24px;border-bottom:1px solid var(--line);padding-bottom:14px}
  .row:last-child{border-bottom:0}
  .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--fg-faint);min-width:120px}
  .spec{font-family:var(--font-mono);font-size:10px;color:var(--fg-dim);margin-left:auto}
</style>
</head>
<body>
<div class="wrap">
  <div class="row"><span class="tag">Hero · 96/600</span><span class="t-hero" style="font-size:72px">Emergence.</span><span class="spec">Space Grotesk · -0.035em</span></div>
  <div class="row"><span class="tag">H1 · 56/600</span><span class="t-h1">Zero to One Enterprise AI</span><span class="spec">Space Grotesk · -0.03em</span></div>
  <div class="row"><span class="tag">H2 · 38/600</span><span class="t-h2">Foundational Expertise</span><span class="spec">Space Grotesk · -0.02em</span></div>
</div>
</body>
</html>
