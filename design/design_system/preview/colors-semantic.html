<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
  .sw{background:var(--bg);padding:20px 20px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;gap:10px}
  .row{display:flex;align-items:center;gap:10px}
  .dot{width:18px;height:18px;border-radius:999px}
  .n{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--fg-dim)}
  .hex{font-family:var(--font-mono);font-size:11px;color:var(--fg)}
  .role{font-size:12px;color:var(--fg-faint);line-height:1.4}
</style>
</head>
<body>
<div class="grid">
  <div class="sw">
    <div class="row"><span class="dot" style="background:#3FB984"></span><span class="n">Success</span></div>
    <div class="hex">#3FB984</div>
    <div class="role">Completed states · uptime · passed checks</div>
  </div>
  <div class="sw">
    <div class="row"><span class="dot" style="background:#E5A23C"></span><span class="n">Warning</span></div>
    <div class="hex">#E5A23C</div>
    <div class="role">Attention · degraded · near-threshold</div>
  </div>
  <div class="sw">
    <div class="row"><span class="dot" style="background:#E5544A"></span><span class="n">Error</span></div>
    <div class="hex">#E5544A</div>
    <div class="role">Failure · blocking · required field</div>
  </div>
  <div class="sw">
    <div class="row"><span class="dot" style="background:#2D6BFF"></span><span class="n">Info</span></div>
    <div class="hex">#2D6BFF</div>
    <div class="role">Notification · focus · brand-aligned</div>
  </div>
</div>
</body>
</html>
