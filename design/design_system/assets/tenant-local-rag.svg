<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-label="Tenant-local RAG architecture diagram">
  <defs>
    
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#044e4c"></path>
    </marker>
  </defs>

  
  <text x="24" y="28" class="title">Tenant-local RAG Architecture (BYOK, audit logs, secure egress)</text>

  
  <g transform="translate(40,60)">
    <rect x="0" y="0" width="120" height="60" class="box-light"></rect>
    <text x="60" y="34" text-anchor="middle" class="text">User</text>
  </g>

  
  <g transform="translate(200,50)">
    <rect x="0" y="0" width="160" height="80" class="box"></rect>
    <text x="80" y="44" text-anchor="middle" class="text">App / UI</text>
  </g>

  
  <g>
    <rect x="390" y="30" width="520" height="280" class="dashed" rx="12" ry="12"></rect>
    <text x="420" y="28" class="small">Tenant Boundary (isolated compute &amp; data)</text>
  </g>

  
  <g transform="translate(420,60)">
    <rect x="0" y="0" width="220" height="88" class="box"></rect>
    <text x="110" y="22" text-anchor="middle" class="text">Orchestrator</text>
    <text x="110" y="42" text-anchor="middle" class="small">Zero-Trust Policy Enforcement</text>
    <text x="110" y="62" text-anchor="middle" class="small">Routing, auth, audit</text>
    
    <rect x="190" y="6" width="18" height="18" class="log" rx="3" ry="3"></rect>
    <text x="214" y="19" class="small">Audit Logs</text>
  </g>

  
  <g transform="translate(420,170)">
    
    <ellipse cx="110" cy="0" rx="110" ry="18" class="cylinder"></ellipse>
    <rect x="0" y="0" width="220" height="84" class="cylinder"></rect>
    <ellipse cx="110" cy="84" rx="110" ry="18" class="cylinder"></ellipse>
    <text x="110" y="48" text-anchor="middle" class="text">Tenant-isolated Vector DB</text>
    <text x="110" y="66" text-anchor="middle" class="small">Encrypted (BYOK)</text>
    
    <rect x="6" y="6" width="18" height="12" class="key" rx="2" ry="2"></rect>
    <text x="30" y="16" class="small">BYOK</text>
  </g>

  
  <g transform="translate(700,80)">
    <rect x="0" y="0" width="200" height="120" class="cloud" rx="18" ry="18"></rect>
    <text x="100" y="36" text-anchor="middle" class="text">LLM</text>
    <text x="100" y="56" text-anchor="middle" class="small">Inference Engine</text>
    <text x="100" y="76" text-anchor="middle" class="note">Data never leaves boundary</text>
  </g>

  
  
  <path d="M160 90 L200 90" class="arrow"></path>
  
  <path d="M360 90 L420 90" class="arrow"></path>
  
  <path d="M520 148 L520 170" class="arrow"></path>
  
  <path d="M640 118 L700 118" class="arrow"></path>
  
  <path d="M540 210 L700 210" class="arrow"></path>

  
  <g transform="translate(880,40)">
    <path d="M0 40 L40 40" stroke="#065f46" stroke-width="3" fill="none" marker-end="url(#arrowhead)"></path>
    <rect x="42" y="28" width="18" height="18" class="secure" rx="3" ry="3"></rect>
    <text x="66" y="40" class="small">Secure Egress</text>
    <text x="66" y="56" class="small">(policy controlled)</text>
  </g>

  
  <g transform="translate(24,270)">
    <rect x="0" y="0" width="14" height="10" class="key"></rect>
    <text x="24" y="9" class="small">BYOK (Bring Your Own Key)</text>

    <rect x="220" y="0" width="14" height="10" class="log"></rect>
    <text x="248" y="9" class="small">Audit logs (append-only)</text>

    <rect x="460" y="0" width="14" height="10" class="secure"></rect>
    <text x="486" y="9" class="small">Secure egress gate</text>
  </g>
</svg>